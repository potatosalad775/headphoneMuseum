<P align=center><FONT size=5 face="ＭＳ Ｐ明朝">光電子式カートリッジ</FONT></P>
<P align=left><FONT size=3 
face="ＭＳ Ｐ明朝">　内蔵したランプの光を、スタイラスに取り付けた小型のスクリーンの動きにより光量の変化として捉え、電圧の変化に置き換えるカートリッジ。シャープはこの様式のカートリッジを自社のレコードプレイヤーやセパレートステレオの最高級機に取り付けていた。</FONT></P>
