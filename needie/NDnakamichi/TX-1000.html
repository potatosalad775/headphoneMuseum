<P align=center><FONT 
face="ＭＳ Ｐ明朝">ターンテーブルのワウ＆フラッターのスペックは、あくまでもターンテーブル単体でのものであり、<BR>実際にレコードを演奏した場合のものではない。その最大の差異はレコードの偏芯が原因である。<BR>レコードの穴は必ずしもレコードの中心にある訳ではない。その補正に挑戦したのがナカミチの<BR>アブソルートセンターサーチシステムであり、その機構を採用したのがTX-1000である。</FONT></P>
