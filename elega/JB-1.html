<P align=center><FONT size=6 face="ＭＳ Ｐ明朝">ジャンクションボックス</FONT></P>
<P align=center><FONT size=6 face="ＭＳ Ｐ明朝">JB-1</FONT></P>
<P align=center><IMG alt="JB-1.JPG - 39,825BYTES" src="JB-1.jpg" width=500 
height=154></P>
<P align=center><IMG alt="JB-1-1.JPG - 46,311BYTES" src="JB-1-1.jpg" width=500 
height=158></P>
<P align=center><FONT 
face="ＭＳ Ｐ明朝">DR-59C、60C、61Cなど1960年代初頭のまだヘッドフォン端子があまり普及していなかった時期の製品のオプションパーツ。<BR>アンプのスピーカー端子に抵抗を介し接続するアダプターで、ヘッドフォン本体と+400円でセットで販売されていた。<BR>ただ接続するだけのJB-1の他、スピーカーとの切替が可能なJB-3、5もあったようだ。</FONT></P>
<P align=center><IMG alt="JB-135.JPG - 47,702BYTES" src="JB-135.jpg" width=400 
height=201></P>
<P align=center><FONT face="ＭＳ Ｐ明朝">(左からJB-1、3、5）</FONT></P>
<P align=center><FONT 
face="ＭＳ Ｐ明朝">同様の製品は、パイオニア等1960年代からヘッドフォンに力を入れていたメーカーに存在する。</FONT></P>
<P align=center><FONT face="ＭＳ Ｐ明朝"><IMG alt="JB-21.JPG - 93,970BYTES" 
src="JB-21.jpg" width=400 height=326>　<IMG alt="JB-21-1.JPG - 89,052BYTES" 
src="JB-21-1.jpg" width=400 height=305></FONT></P>
<P align=center><FONT face="ＭＳ Ｐ明朝">（パイオニアのJB-21。スピーカーとの切替機能のあるタイプ 
管理人所有機）</FONT></P>
